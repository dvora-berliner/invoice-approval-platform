apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: submission-outbox-statestore
scopes:
  - submission-service
spec:
  type: state.redis
  version: v1
  metadata:
    - name: redisHost
      value: redis:6379
    - name: redisPassword
      value: ""
    - name: outboxPublishPubsub
      value: pubsub
    - name: outboxPublishTopic
      value: InvoiceSubmitted
