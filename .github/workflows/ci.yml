name: CI

on:
  push:
    branches: ["**"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Regenerates package-lock.json here (on Linux, matching this runner) before the
      # strict `npm ci` install - keeps package-lock.json self-healing across platforms
      # without weakening the deterministic install step itself.
      - run: npm install --package-lock-only

      - run: npm ci

      - run: npm run build --workspaces --if-present

      - run: npm test
