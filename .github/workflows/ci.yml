name: CI

on:
  push:
    branches: ["**"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: rm -f package-lock.json
      - run: npm install

      - run: npm run lint

      - run: npm run build --workspaces --if-present

      - run: npm test
