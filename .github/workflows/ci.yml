name: CI

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: rm -f package-lock.json
      - run: npm install

      - run: npm run lint

      - run: npm run build --workspaces --if-present

      - run: npm test

  integration-tests:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: cp secrets.json.example secrets.json

      - run: docker compose up -d --build audit-service audit-service-dapr

      - run: npm run test:integration

      - if: always()
        run: docker compose down

  # N2: once the quality gates above pass, build + publish every service's image -
  # no manual release step. Only for main/dev, not every feature branch push.
  publish-images:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: api-gateway
            context: .
            dockerfile: services/api-gateway/Dockerfile
          - service: submission-service
            context: .
            dockerfile: services/submission-service/Dockerfile
          - service: decision-service
            context: .
            dockerfile: services/decision-service/Dockerfile
          - service: workflow-service
            context: .
            dockerfile: services/workflow-service/Dockerfile
          - service: payment-service
            context: .
            dockerfile: services/payment-service/Dockerfile
          - service: audit-service
            context: .
            dockerfile: services/audit-service/Dockerfile
          - service: ui
            context: ./ui
            dockerfile: ui/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/invoice-approval-platform-${{ matrix.service }}:latest
            ghcr.io/${{ github.repository_owner }}/invoice-approval-platform-${{ matrix.service }}:${{ github.sha }}
